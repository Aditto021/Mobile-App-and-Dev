name: Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Restore signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Configure ANDROID_KEYSTORE_BASE64 with the existing signing keystore before publishing.' }
          New-Item -ItemType Directory -Force .secrets | Out-Null
          $keyPath = Join-Path $env:GITHUB_WORKSPACE '.secrets/release.keystore'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "FERIWALA_KEYSTORE_PATH=$keyPath" >> $env:GITHUB_ENV
      - name: Build, test, verify, and publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FERIWALA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FERIWALA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FERIWALA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./scripts/publish_release.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FeriWala-Android
          path: release/
