name: Android release
# Every push to main that changes the app becomes a phone update: the
# build gets its own number, is published on GitHub Releases, and installed
# apps offer it under Account > App updates (and on launch).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'store/**'
      - 'server/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      # Keep packages on the same drive as the project (D:): Kotlin's
      # incremental compiler fails on plugin sources from another drive.
      PUB_CACHE: D:\pub-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
          pub-cache-path: D:\pub-cache
      - name: Restore signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {
            Write-Host '::warning::No ANDROID_KEYSTORE_BASE64 secret, so no release was published. Add it (see README) to publish APK updates.'
            'SKIP_RELEASE=true' >> $env:GITHUB_ENV
            exit 0
          }
          New-Item -ItemType Directory -Force .secrets | Out-Null
          $keyPath = Join-Path $env:GITHUB_WORKSPACE '.secrets/release.keystore'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "FERIWALA_KEYSTORE_PATH=$keyPath" >> $env:GITHUB_ENV
      - name: Number this build
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Only in this runner's copy: pubspec.yaml in the repo is not changed.
          $text = Get-Content pubspec.yaml -Raw
          $m = [regex]::Match($text, '(?m)^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)')
          if (-not $m.Success) { throw 'pubspec.yaml needs version: X.Y.Z+N' }
          # Always higher than the last build: pubspec code + 100 + run number.
          $code = [long]$m.Groups[4].Value + 100 + [long]$env:RUN_NUMBER
          # Patch number grows with each run: 1.3.0 -> 1.3.6, 1.3.7, ...
          $name = "$($m.Groups[1].Value).$($m.Groups[2].Value).$([long]$m.Groups[3].Value + [long]$env:RUN_NUMBER)"
          $text = $text.Remove($m.Index, $m.Length).Insert($m.Index, "version: $name+$code")
          [IO.File]::WriteAllText((Resolve-Path pubspec.yaml), $text)
          Write-Host "Building feriWala $name (code $code)"
          # The commit message (first line) becomes the update note on phones.
          $note = (($env:COMMIT_MESSAGE -split "`n")[0]).Trim()
          if ($note.Length -gt 300) { $note = $note.Substring(0, 300) }
          if ($note) { "RELEASE_NOTES=$note" >> $env:GITHUB_ENV }
      - name: Create the temp folder Gradle uses
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        # android/gradle.properties points Java's temp files at D:\tmp.
        run: New-Item -ItemType Directory -Force 'D:\tmp' | Out-Null
      - name: Build, test, verify, and publish
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FERIWALA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FERIWALA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FERIWALA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release.log'
          try {
            ./scripts/publish_release.ps1 *>&1 | Tee-Object -FilePath $log
          } catch {
            # Show why on the run's summary page, not only in the step log.
            $lines = @(Get-Content $log -ErrorAction SilentlyContinue)
            $hits = $lines | Select-String -Pattern 'error|What went wrong|Exception|failed|FAILURE|\[E\]|Some tests' | Select-Object -Last 25
            $text = (@($hits | ForEach-Object Line) + '--- last lines ---' + ($lines | Select-Object -Last 20) + '--- thrown ---' + ($_ | Out-String)) -join "`n"
            $text = $text -replace '\x1b\[[0-9;]*m', ''
            if ($text.Length -gt 6000) { $text = $text.Substring($text.Length - 6000) }
            Write-Host ("::error title=Release failed::" + ($text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            throw
          }
      - uses: actions/upload-artifact@v5
        if: success() && env.SKIP_RELEASE != 'true'
        with:
          name: FeriWala-Android
          path: release/
