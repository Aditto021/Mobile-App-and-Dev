name: feriwala
description: "feriWala — premium e-commerce"
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  cached_network_image: ^4.0.6
  shared_preferences: ^2.5.6
  smooth_page_indicator: ^3.0.0
  confetti: ^0.8.0
  flutter_staggered_grid_view: ^0.7.0
  iconsax_flutter: ^1.0.1
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/brand/

  shaders:
    - shaders/nebula.frag

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0B0518"
  adaptive_icon_foreground: assets/brand/icon_fg.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#0B0518"
    theme_color: "#7C3AED"

flutter_native_splash:
  color: "#0B0518"
  image: assets/brand/splash.png
  android_12:
    color: "#0B0518"
    image: assets/brand/splash.png
  web: false
